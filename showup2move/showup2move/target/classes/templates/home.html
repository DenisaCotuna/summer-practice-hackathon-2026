<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Home</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <h2><i class="fa fa-home"></i> Welcome to the Home Page</h2>
    <form th:action="@{/createevent}" method="get">
        <button type="submit" class="btn btn-primary">Create Event</button>
    </form>
    <form th:action="@{/logout}" method="post">
        <button type="submit" class="btn btn-danger">Logout</button>
    </form>

    <span th:if="${events != null}">
        <div class="container">
            <div class="row">
                <div class="col-md-4 mb-3" th:each="event : ${events}">
                    <div class="card h-100">
                        <div class="card-body">
                            <h5 class="card-title" th:text="${event.name}">Event Name:</h5>

                            <b>Sport:</b>
                            <span th:text="${event.sports.name}"></span><br>
                            <b>Size:</b>
                            <span th:text="${event.size}"></span><br>
                            <b>Participants:</b>
                            <span th:each="userEvent : ${event.userEvents}" th:text="${userEvent.user.name} + ' '"></span><br>
                            
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </span>
    <span th:unless = "${events != null}">
      There are no Events yet. Create one to get started!
    </span>
</body>
</html>
