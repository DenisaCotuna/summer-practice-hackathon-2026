<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Create User Details</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    </head>
    <body class="container mt-5">
        <h2>Create Your Profile</h2>
        <form method="post" onsubmit="return validateSports()">
            <input type="text" id="bio" name = "bio" class="form-control mb-3" placeholder="Tell us about yourself..." required>
            <div class ="sports-preferences mb-3">
                <label class="check-label">Select Your Favorite Sports:</label><br>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" id="football" name="sports" value="Football">
                    <label class="form-check-label" for="football">Football</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" id="tennis" name="sports" value="Tennis">
                    <label class="form-check-label" for="tennis">Tennis</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" id="basketball" name="sports" value="Basketball">
                    <label class="form-check-label" for="basketball">Basketball</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" id="volleyball" name="sports" value="Volleyball">
                    <label class="form-check-label" for="volleyball">Volleyball</label>
                </div>
            </div>
            <input type="submit" class="btn btn-primary" value="Save Preferences">
        </form>
        <script src="/js/createuserdetails.js" ></script>
    </body>
</html>
