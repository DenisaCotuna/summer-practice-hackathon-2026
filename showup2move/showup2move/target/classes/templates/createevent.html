<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">  
    <head>
        <title>Create Event</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    </head>
    <body class="container mt-5">
        <h2>Create Event</h2>
        <form method="post" onsubmit="return validateSports()">
            <div class="form-group">
                <label for="name">Event Name:</label>
                <input type="text" class="form-control" id="name" name="name" required>
            </div>
            <div class ="sport-type mb-3">
                <label class="check-label">Select Sport Type:</label><br>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" id="football" name="sports" value="Football">
                    <label class="form-check-label" for="football">Football</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" id="tennis" name="sports" value="Tennis">
                    <label class="form-check-label" for="tennis">Tennis</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" id="basketball" name="sports" value="Basketball">
                    <label class="form-check-label" for="basketball">Basketball</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" id="volleyball" name="sports" value="Volleyball">
                    <label class="form-check-label" for="volleyball">Volleyball</label>
                </div>
            </div>
            <div class="form-group">
                <label for="size">Event Size:</label>
                <input type="number" class="form-control" id="size" name="size" required>
            </div>
            <button type="submit" class="btn btn-primary">Create Event</button>
        </form>
        <script src="/js/createevent.js" ></script>
    </body>
</html>
